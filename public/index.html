<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Local Static Site</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="Header">
        <h1>Lab 1 - Computer Security Login Screen</h1>
    </div>
    <div class="Login">
        <h1>Please Login</h1>
        <div class="userpass">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="Username">
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="password">
            </div>
            <button type="button" onclick="completeLogin()">Submit</button>
        </div>
        <div class="pagelinks">
            <a href="resetpages/reset.html">Reset Password<a>
            <a href="registration/registration.html">Register Account<a>
        </div>
    </div>
    <script src="login.js" defer></script>
</body>

</html>

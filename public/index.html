<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Static Site</title>
    <link rel="stylesheet" href="styles.css">
    <script src="login.js" defer></script>
</head>

<body>
    <header class="Header">
        <h1>Lab 4 - Computer Security Login Screen</h1>
    </header>

    <main class="Login">
        <h1>Please Login</h1>
        
 <form id="loginForm" class="userpass" method="POST" action="#">
    <div>
        <label for="username">Username:</label>
        <input 
            type="text" 
            id="username" 
            name="username" 
            autocomplete="username" 
            required 
            placeholder="Username"
        >
    </div>
    <div>
        <label for="password">Password:</label>
        <input 
            type="password" 
            id="password" 
            name="password" 
            autocomplete="current-password" 
            required 
            placeholder="Password"
        >
    </div>
    <button type="submit">Submit</button>
</form>

        <nav class="pagelinks">
            <a href="resetpages/reset.html">Reset Password</a>
            <a href="registration/registration.html">Register Account</a>
        </nav>
    </main>
</body>

</html>

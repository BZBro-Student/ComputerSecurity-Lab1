<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Local Static Site</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="Header">
        <h1>Lab 1 - Computer Security Reset Screen</h1>
    </div>
    <div class="Login">
        <h2>Please create 3 short security questions:</h2>
        <label for="security1">Security Question 1:</label>
        <input type="text" id="security1" maxlength="200">   
        <label for="answer1">Answer 1:</label>
        <input type="text" id="answer1">
        <label for="security2">Security Question 2:</label>
        <input type="text" id="security2" maxlength="200">
        <label for="answer2">Answer 2:</label>
        <input type="text" id="answer2">
        <label for="security3">Security Question 3:</label>   
        <input type="text" id="security3" maxlength="200">  
        <label for="answer3">Answer 3:</label>
        <input type="text" id="answer3">
        <button onclick="completeRegistration()">Submit</button>
        <div class = "pagelinks">
            <a href="/index.html">Home</a>
        </div>
    </div>
    <script src="./registration.js" defer></script>
</body>

</html>

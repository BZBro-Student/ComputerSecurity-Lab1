<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Step 1</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="./reset.js" defer></script>
</head>

<body>
    <header class="Header">
        <h1>Lab 1 - Computer Security Reset Screen</h1>
    </header>

    <main class="Login">
        <h1>Reset Password</h1>

        <form id="resetStep1Form" class="userpass">
            <div>
                <label for="username">Username:</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    autocomplete="username" 
                    required 
                    placeholder="Enter your username"
                >
            </div>
            <button type="submit">Next</button>
        </form>

        <nav class="pagelinks">
            <a href="/index.html">Home</a>
        </nav>
    </main>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Local Static Site</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="Header">
        <h1>Lab 1 - Computer Security Reset Screen</h1>
    </div>
    <div class="Login">
        <h1>Please Reset</h1>
        <div class="userpass">
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="Username">
                <label for="newpassword">New Password:</label>
                <input type="password" id="newpassword" placeholder="New Password">
                <label for="checknewpassword">New Password Again:</label>
                <input type="password" id="checknewpassword" placeholder="New Password Again">
        </div>
        <div class = "pagelinks">
            <a href="/index.html">Home</a>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>

</html>

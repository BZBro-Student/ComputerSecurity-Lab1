<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Local Static Site</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="Header">
        <h1>Lab 1 - Computer Security Reset Screen</h1>
    </div>
    <div class="Login">
        <h2>Please answer 3 short security questions:</h2>
    
        <p id="question1"></p>
        <label for="security1">Answer 1:</label>
        <input type="text" id="security1" placeholder="Enter answer 1">
        <p id="question2"></p>
        <label for="security2">Answer 2:</label>
        <input type="text" id="security2" placeholder="Enter answer 2">
        <p id="question3"></p>
        <label for="security3">Answer 3:</label>   
        <input type="text" id="security3" placeholder="Enter answer 3">   

        <button type="button" onclick="finishReset()">Submit</button>

        <div class="pagelinks">
            <a href="/index.html">Home</a>
        </div>
    </div>
    <script src="./reset.js" defer></script>
</body>

</html>
